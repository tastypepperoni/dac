name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go.mod and go.sum are tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: race
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./cmd/dac

  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build the draft
        run: |
          pip install xml2rfc abnf
          cd draft
          xml2rfc --text --html draft-manelidis-dnsop-domain-affiliation-00.xml
      - name: idnits
        run: npx --yes @ietf-tools/idnits --mode submission --offline draft/draft-manelidis-dnsop-domain-affiliation-00.xml
      - name: examples match the ABNF
        run: cd draft && python3 check_abnf.py draft-manelidis-dnsop-domain-affiliation-00.txt
