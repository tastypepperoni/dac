name: go-sum (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  go-sum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: compute and commit go.sum
        run: |
          go mod tidy
          git config user.name "Dimitri Manelidis"
          git config user.email "tastypepperoni@gmail.com"
          git add go.sum go.mod
          git commit -m "Add go.sum"
          git push
